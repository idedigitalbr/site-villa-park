name: villapark-site

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: villapark-web
    restart: always
    networks:
      - default
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.villapark-router.rule=Host(`villapark.suporteide.digital`) || Host(`villaplazapark.suporteide.digital`) || Host(`villaplazapark.com.br`) || Host(`www.villaplazapark.com.br`) || Host(`villapark.com.br`) || Host(`www.villapark.com.br`)"
      - "traefik.http.routers.villapark-router.entrypoints=websecure"
      - "traefik.http.routers.villapark-router.tls=true"
      - "traefik.http.routers.villapark-router.tls.certresolver=letsencrypt"
      - "traefik.http.services.villapark-service.loadbalancer.server.port=80"

networks:
  default:
  proxy:
    external: true
