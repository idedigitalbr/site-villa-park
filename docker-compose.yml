version: '3.8'

services:
  site-villa-park:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: site-villa-park
    restart: unless-stopped
    ports:
      - "${PORT:-8085}:80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
