<svg xmlns="http://www.w3.org/2000/svg" width="60" height="24" viewBox="0 0 60 24">
  <defs>
    <!-- Gradiente de Iluminação Cilíndrica para os Filamentos de Juta -->
    <linearGradient id="juteStrandLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3E0"/>
      <stop offset="25%" stop-color="#E5B97C"/>
      <stop offset="65%" stop-color="#B67B38"/>
      <stop offset="100%" stop-color="#693C11"/>
    </linearGradient>
    <linearGradient id="juteStrandDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE8C8"/>
      <stop offset="35%" stop-color="#D49F5B"/>
      <stop offset="75%" stop-color="#9E6224"/>
      <stop offset="100%" stop-color="#542E0C"/>
    </linearGradient>
  </defs>

  <!-- Elo 1 (Diagonal Inclinada) -->
  <path d="M-6,18 Q4,3 16,6 Q21,8 19,17 Q15,23 1,22 Z" fill="url(#juteStrandLight)" stroke="#522D0C" stroke-width="0.75"/>
  <path d="M-4,9 Q5,5 15,7" stroke="#FFF7E6" stroke-width="0.8" stroke-linecap="round" opacity="0.65" fill="none"/>
  <path d="M1,19 Q11,21 17,17" stroke="#381D08" stroke-width="0.9" stroke-linecap="round" opacity="0.85" fill="none"/>

  <!-- Elo 2 -->
  <path d="M14,18 Q24,3 36,6 Q41,8 39,17 Q35,23 21,22 Z" fill="url(#juteStrandDark)" stroke="#522D0C" stroke-width="0.75"/>
  <path d="M16,9 Q25,5 35,7" stroke="#FFF7E6" stroke-width="0.8" stroke-linecap="round" opacity="0.65" fill="none"/>
  <path d="M21,19 Q31,21 37,17" stroke="#381D08" stroke-width="0.9" stroke-linecap="round" opacity="0.85" fill="none"/>

  <!-- Elo 3 -->
  <path d="M34,18 Q44,3 56,6 Q61,8 59,17 Q55,23 41,22 Z" fill="url(#juteStrandLight)" stroke="#522D0C" stroke-width="0.75"/>
  <path d="M36,9 Q45,5 55,7" stroke="#FFF7E6" stroke-width="0.8" stroke-linecap="round" opacity="0.65" fill="none"/>
  <path d="M41,19 Q51,21 57,17" stroke="#381D08" stroke-width="0.9" stroke-linecap="round" opacity="0.85" fill="none"/>

  <!-- Elo 4 (Fechamento Perfeito de 60px para loop contínuo) -->
  <path d="M54,18 Q64,3 76,6 Q81,8 79,17 Q75,23 61,22 Z" fill="url(#juteStrandDark)" stroke="#522D0C" stroke-width="0.75"/>
  <path d="M56,9 Q65,5 75,7" stroke="#FFF7E6" stroke-width="0.8" stroke-linecap="round" opacity="0.65" fill="none"/>
</svg>
