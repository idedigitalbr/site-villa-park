<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 90" width="100%" height="100%" preserveAspectRatio="none">
  <defs>
    <!-- Base Wood Gradient (Birch / Pinus) -->
    <linearGradient id="birchWoodGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF8ED"/>
      <stop offset="15%" stop-color="#F8E5CA"/>
      <stop offset="45%" stop-color="#ECCFB0"/>
      <stop offset="75%" stop-color="#DFBD95"/>
      <stop offset="100%" stop-color="#CF9E68"/>
    </linearGradient>

    <!-- Bevel Inner Light -->
    <linearGradient id="bevelLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#7A4515" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <!-- Main Wooden Board Shape with Rounded Corners -->
  <rect x="2" y="2" width="196" height="84" rx="16" ry="16" fill="url(#birchWoodGrad)" stroke="url(#bevelLight)" stroke-width="2.5"/>

  <!-- Subtle Natural Wood Grain Wave Lines -->
  <g opacity="0.18" stroke="#7A4212" stroke-linecap="round" fill="none">
    <!-- Grain line 1 -->
    <path d="M 6,18 Q 45,14 100,16 Q 155,18 194,15" stroke-width="1.2"/>
    <!-- Grain line 2 -->
    <path d="M 6,32 Q 50,35 110,31 Q 160,28 194,32" stroke-width="1.4"/>
    <!-- Knot subtle ring -->
    <ellipse cx="65" cy="48" rx="14" ry="4" stroke-width="1.2" opacity="0.5"/>
    <path d="M 6,48 Q 45,45 50,48 M 80,48 Q 130,51 194,47" stroke-width="1.2"/>
    <!-- Grain line 3 -->
    <path d="M 6,64 Q 60,61 120,65 Q 165,68 194,63" stroke-width="1.3"/>
    <!-- Grain line 4 -->
    <path d="M 6,76 Q 70,78 135,74 Q 170,72 194,76" stroke-width="1.2"/>
  </g>

  <!-- Top Rim Highlight -->
  <path d="M 16,3 L 184,3" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>

  <!-- Bottom Rim Shadow -->
  <path d="M 16,85 L 184,85" stroke="#5E2F0A" stroke-width="2" stroke-linecap="round" opacity="0.45"/>
</svg>
