<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="22" height="22" fill="none">
  <!-- Outer Ring / Clock Dial -->
  <circle cx="12" cy="12" r="10" stroke="#3E1A05" stroke-width="2.2" fill="#FDF4EA" fill-opacity="0.15"/>
  <!-- Center Pin -->
  <circle cx="12" cy="12" r="1.5" fill="#3E1A05"/>
  <!-- Hour Hand pointing to 10 o'clock -->
  <line x1="12" y1="12" x2="8.5" y2="8" stroke="#3E1A05" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Minute Hand pointing to 2 o'clock -->
  <line x1="12" y1="12" x2="16.2" y2="7.5" stroke="#3E1A05" stroke-width="1.8" stroke-linecap="round"/>
  <!-- 4 Main Hour Ticks (12, 3, 6, 9) -->
  <line x1="12" y1="3" x2="12" y2="4.5" stroke="#3E1A05" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="21" y1="12" x2="19.5" y2="12" stroke="#3E1A05" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="12" y1="21" x2="12" y2="19.5" stroke="#3E1A05" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="3" y1="12" x2="4.5" y2="12" stroke="#3E1A05" stroke-width="1.5" stroke-linecap="round"/>
</svg>
